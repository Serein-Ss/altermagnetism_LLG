scope:
  - 128 branches is a bounded pilot, not power-sized equivalence certification
  - Calibration cores are empirical proposals, not validated metastable basins
  - No infinite-time committor or published lifetime certification
  - No equilibrium assumption, no reversibility-based committor loss
  - No transition-selected sample counts interpreted as physical occupancy
  - No training or adaptive resampling in this campaign
  - State selection is stratified and outcome-blind; same starts for all arms
  - New labels and priority queue are development-only, not final holdout data
